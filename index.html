<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/style.css">
        <script type="module" src="src/app.js"></script>
         <!-- O type="module" possibilita que o arquivo possa importar funções de outros arquivos  -->

        <title>Maison Aurèle - Projeto Demonstrativo</title>
    </head>
    <body>
        <header>
            <div class="logoName" id="home">
                <img src="IMGs/SVGs/logo.svg" alt="Logo do restaurante" id="img-return">
                <div class="namerestaurant">
                    <h1 id="title1">MAISON AURÈLE</h1>
                    
                    <div class="p-custom" id="text">
                        <div class="line"></div>

                        <p id="kitchen">COZINHA CONTEMPORÂNEA</p> 

                        <div class="line"></div>
                        
                    </div>
                </div>
            </div>

            <!-- Botão que só vai aparecer em aparelhos menores -->
            <button class="hamburguer" id="hamburguer" aria-label="Abri-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="navbar" id="navbar">
                <ul>
                    <li><a href="#/home" id="atualPag" data-route-link="home" >Início</a></li>
                    <li><a href="#/about" data-route-link="about" >Sobre</a></li>
                    <li><a href="#/menu" data-route-link="menu" >Cardápio</a></li>
                    <li><a href="#/gallery" data-route-link="gallery" >Galeria</a></li>
                    <li><a href="#/contacts" data-route-link="contacts" >Contatos</a></li>
                </ul>
            </nav>
        </header>

        <main id="app">
            
        </main>

        <footer>
            <div class="logoName">
               
                <div class="end" id="end-1">

                    <img src="IMGs/SVGs/logo.svg" alt="Logo do restaurante">
                    <div class="container">
                        <h1 id="sub-title1">Maison Aurèle</h1>
                        
                        <div class="p-custom" id="div">
                            <div class="line"></div>
                            <p id="kit-p">COZINHA CONTEMPORÂNEA</p>
                            <div class="line"></div>
                        
                        </div>
                    </div>
                    
                </div>

                
            </div>

            <div class="direitos" id="copyR">
                    <p>
                        Maison Aurèle. Todos os direitos reservados.
                    </p>
            </div>
           

            <div class="back" id="back-home">
                <p><a href="#">Voltar ao topo</a></p>
            </div>

        </footer>

        <script src="src/script.js"></script>
    </body>
</html>
